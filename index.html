<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cholo 1T - Tren del Desastre</title>
    <style>
        :root { --p: #8b0000; --glow: #ff4500; --bg: #0a0a0c; }
        body { background: var(--bg); color: white; font-family: 'Courier New', Courier, monospace; margin: 0; overflow: hidden; }

        /* Escena de Fondo: Clima Rojo y Lluvia */
        .background-scene {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #4b0000 0%, #000000 100%);
            z-index: -2;
        }

        /* Rayos de Verdad */
        .lightning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: -1;
            animation: thunder 5s infinite;
        }
        @keyframes thunder {
            0%, 90%, 100% { opacity: 0; }
            92% { opacity: 0.3; }
            94% { opacity: 0.1; }
            96% { opacity: 0.6; }
        }

        /* Trenes Flotantes (Efecto Tren del Desastre) */
        .floating-train {
            position: fixed; bottom: -100px; font-size: 40px;
            animation: moveUp 4s linear infinite; z-index: 5;
        }
        @keyframes moveUp {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-110vh); opacity: 0; }
        }

        /* Pantalla Principal */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 3.5rem; color: #ff0000; text-shadow: 0 0 20px var(--p); margin: 0; }
        .train-art { font-size: 80px; margin: 20px; filter: drop-shadow(0 0 10px red); }

        .btn {
            padding: 20px 50px; background: var(--p); color: white; border: 2px solid white;
            border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1.5rem;
            box-shadow: 0 0 20px var(--p); transition: 0.3s;
        }
        .btn:hover { background: #ff0000; transform: scale(1.1); }

        /* Tienda */
        .tienda { display: none; padding: 50px; }
        .card { background: rgba(0,0,0,0.8); border: 2px solid red; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; }
        #status { color: #0f0; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="background-scene"></div>
    <div class="lightning"></div>

    <div class="hero" id="inicio">
        <div class="train-art">🚂💨</div>
        <h1>BIENVENIDO AL TREN DEL DESASTRE</h1>
        <p style="color: #ff4500;">CHOLO 1T - SCRIPTS DE ALTO IMPACTO</p>
        <button class="btn" onclick="iniciarAtaque()">VER SCRIPTS VIP</button>

    <div class="tienda" id="tienda">

            <p>Auto-Reset | Anti-Detect | Modo Locura</p>
            <button class="btn" style="font-size: 1rem;" onclick="copiarScript()">📋 COPIAR TODO EL SCRIPT</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        // TU WEBHOOK REAL
        const webhookUrl = "https://discord.com/api/webhooks/1498847220760449145/xLBUawdxa3vviK-PBY7-Z-T6wWfsAmHfdZxgCAFllijurZ85DtHCC8Jr1oo03L7oPTef";

        // EL SCRIPT DE ROBLOX COMPLETO
        const scriptFinal = `-- SCRIPT UNIFICADO CHOLO 1T \nprint("Cargando Tren del Desastre...");\nlocal POS_ARTURO_1 = CFrame.new(154.02, 43.73, 513.57)\n-- [Aquí van tus 3 scripts unidos]`;

</html>
