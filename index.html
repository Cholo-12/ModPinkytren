<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cholo 1T - Tienda de Scripts</title>
    <style>
        :root {
            --principal: #8a2be2;
            --lila: #e0b0ff;
            --oscuro: #0a0a0c;
        }

        body {
            background-color: var(--oscuro);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rayo {
            position: fixed;
            width: 150px;
            z-index: 10;
            filter: drop-shadow(0 0 10px var(--lila));
        }
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; transform: scaleX(-1); }

        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, #2a0e4a 0%, #0a0a0c 100%);
        }

        h1 {
            font-size: 3.5rem;
            color: var(--lila);
            text-shadow: 0 0 20px var(--principal);
            margin-bottom: 10px;
        }

        .btn-tienda {
            padding: 15px 40px;
            background-color: var(--principal);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            box-shadow: 0 0 15px var(--principal);
        }

        .btn-tienda:hover {
            transform: scale(1.1);
            background-color: var(--lila);
            color: var(--oscuro);
        }

        .tienda-section {
            display: none;
            padding: 50px;
            width: 80%;
        }

        .card {
            background: #16161a;
            border: 2px solid var(--principal);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #000;
            color: #0f0;
            border: 1px solid #333;
            font-family: monospace;
            margin-top: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <img src="https://i.imgur.com/vHq0W2f.png" class="rayo top-left" alt="rayo">
    <img src="https://i.imgur.com/vHq0W2f.png" class="rayo top-right" alt="rayo">

    <div class="hero" id="inicio">
        <h1>BIENVENIDO A LA PÁGINA DE CHOLO 1T</h1>
        <p>Los mejores scripts para Roblox y más.</p>
        <a href="javascript:void(0)" class="btn-tienda" onclick="mostrarTienda()">VER TIENDA</a>
    </div>

    <div class="tienda-section" id="tienda">
        <h2 style="color: var(--lila);">FARMEO VENEYORW - PACK 3 EN 1</h2>
        <div class="card">
            <p>Este pack incluye: Auto-Reset, Anti-Detección y Modo Locura X2.</p>
            <textarea readonly>
-- ==========================================
-- SCRIPT 1: AUTO-RESET CADA 2 ENTREGAS
-- ==========================================
local POS_ARTURO_1 = CFrame.new(154.02, 43.73, 513.57)
local carpetaNPCs_1 = game.Workspace:WaitForChild("Works"):WaitForChild("DeliveryNpcs")
local jugador_1 = game.Players.LocalPlayer
local RADIO_DETECCION_1 = 12 

local entregasRealizadas = 0
local bloqueadoPorReset = false

local function interactuar_1(p)
    p.HoldDuration = 0
    fireproximityprompt(p)
    task.wait(0.5) 
end

local function ejecutarCiclo_1()
    if bloqueadoPorReset then return end
    local char = jugador_1.Character
    local hrp = char and char:FindFirstChild("HumanoidRootPart")
    local hum = char and char:FindFirstChild("Humanoid")
    if not hrp or not hum or hum.Health <= 0 then return end

    local npcDestino = carpetaNPCs_1:FindFirstChildOfClass("Model") or carpetaNPCs_1:FindFirstChildOfClass("Part")
    
    if npcDestino then
        hrp.CFrame = npcDestino:GetPivot() * CFrame.new(0, 0, 2)
    else
        hrp.CFrame = POS_ARTURO_1
    end

    hrp.Velocity = Vector3.zero

    local objetos = game.Workspace:GetPartBoundsInRadius(hrp.Position, RADIO_DETECCION_1)
    for _, obj in pairs(objetos) do
        local p = obj:FindFirstChildWhichIsA("ProximityPrompt") or obj.Parent:FindFirstChildWhichIsA("ProximityPrompt")
        if p then
            interactuar_1(p)
            if npcDestino then
                entregasRealizadas = entregasRealizadas + 1
                print("Entregas: " .. entregasRealizadas .. "/2")
                task.wait(1)
            end
            break
        end
    end

    if entregasRealizadas >= 2 then
        entregasRealizadas = 0
        bloqueadoPorReset = true
        hum.Health = 0 
    end
end

jugador_1.CharacterAdded:Connect(function()
    task.wait(1)
    bloqueadoPorReset = false
end)

game:GetService("RunService").Heartbeat:Connect(function()
    ejecutarCiclo_1()
end)

-- [MÁS SCRIPTS ABAJO...]
            </textarea>
            <p style="font-size: 0.8rem; color: #555;">Sistema de seguridad activo.</p>
        </div>
    </div>

</body>
</html>
